name: Control de Pull Request - Main

on:
  pull_request:
    branches:
      - main

jobs:
  validar-flujo-gitflow:
    runs-on: ubuntu-latest

    steps:
      - name: Validar rama de origen
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$SOURCE_BRANCH" != "develop" && ! "$SOURCE_BRANCH" =~ ^hotfix/.+ ]]; then
            echo "Rama no permitida: $SOURCE_BRANCH"
            echo "El Pull Request debe venir desde develop o hotfix/*."
            exit 1
          fi

          echo "Rama permitida: $SOURCE_BRANCH"

      - name: Validar titulo del Pull Request
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|test|refactor|ci|chore|release):[[:space:]].+ ]]; then
            echo "Titulo no permitido: $PR_TITLE"
            echo "Debe comenzar con un prefijo valido seguido de dos puntos."
            echo "Ejemplo: release: prepara version estable"
            exit 1
          fi

          echo "Titulo permitido: $PR_TITLE"

      - name: Validar descripcion del Pull Request
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "${PR_BODY//[[:space:]]/}" ]]; then
            echo "El Pull Request debe incluir una descripcion."
            exit 1
          fi

          echo "El Pull Request contiene una descripcion."